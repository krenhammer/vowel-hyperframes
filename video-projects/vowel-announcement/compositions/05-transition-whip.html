<div data-composition-id="transition-whip" data-start="0" data-duration="1.5" data-width="1920" data-height="1080" style="width: 1920px; height: 1080px; position: absolute; overflow: hidden; background: transparent;">
  <style>
    .streak {
      position: absolute;
      top: 50%;
      left: -50%;
      width: 200%;
      height: 4px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), rgba(51,212,200,0.9), rgba(255,255,255,0.8), transparent);
      filter: blur(8px);
      transform: translateY(-50%);
    }
    .flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(51,212,200,0.3) 0%, transparent 70%);
      opacity: 0;
    }
  </style>
  <div class="streak"></div>
  <div class="flash"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function(){
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo('.streak', { xPercent: -150 }, { xPercent: 150, duration: 0.6, ease: 'power3.in' }, 0.2);
      tl.to('.flash', { opacity: 1, duration: 0.2, ease: 'power2.out' }, 0.4);
      tl.to('.flash', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 0.6);
      tl.to({}, { duration: 1.5 }, 0);
      window.__timelines['transition-whip'] = tl;
    })();
  </script>
</div>
