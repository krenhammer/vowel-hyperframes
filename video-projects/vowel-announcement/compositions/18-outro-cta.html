<div data-composition-id="outro-cta" data-start="0" data-duration="15" data-width="1920" data-height="1080" style="width: 1920px; height: 1080px; position: absolute; display: grid; place-items: center; background: transparent;">

  <span class="logo">vowel</span>

  <script>
    (function(){
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from('.logo', { scale: 0.8, opacity: 0, duration: 1.0, ease: 'power3.out' }, 0.3);
      tl.to('.logo', { textShadow: '0 0 70px rgba(51,212,200,0.8), 0 0 120px rgba(51,212,200,0.5), 0 0 180px rgba(51,212,200,0.3)', duration: 2, ease: 'sine.inOut', yoyo: true, repeat: 6 }, 1.5);

      tl.to('.url', { opacity: 1, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: 8 }, 2.5);
      tl.to('.shimmer', { x: '300%', duration: 1.5, ease: 'power2.inOut' }, 2.0);
      tl.set('.shimmer', { x: '-150%' }, 5.0);
      tl.to('.shimmer', { x: '300%', duration: 1.5, ease: 'power2.inOut' }, 5.0);
      tl.set('.shimmer', { x: '-150%' }, 10.0);
      tl.to('.shimmer', { x: '300%', duration: 1.5, ease: 'power2.inOut' }, 10.0);
      tl.to({}, { duration: 15 }, 0);
      window.__timelines['outro-cta'] = tl;
    })();
