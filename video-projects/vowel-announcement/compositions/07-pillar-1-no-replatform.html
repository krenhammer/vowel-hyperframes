<div data-composition-id="pillar-1-no-replatform" data-start="0" data-duration="3" data-width="1920" data-height="1080" style="width: 1920px; height: 1080px; position: absolute; display: grid; place-items: center; background: transparent;">
  <style>
    @font-face {
      font-family: 'Electrolize';
      src: url('../assets/Electrolize-Regular.ttf') format('truetype');
    }
    .line {
      font-family: 'Electrolize', sans-serif;
      position: absolute;
      background: linear-gradient(180deg, #fff 0%, #999 100%);
      -webkit-background-clip: text;
      color: transparent;
    }
    .l1 { font-size: 100px; margin-top: -80px; }
    .l2 {
      font-size: 80px;
      margin-top: 60px;
      text-decoration: line-through;
      text-decoration-color: #33d4c8;
      text-decoration-thickness: 4px;
    }
    .app-icon {
      position: absolute;
      width: 120px;
      height: 90px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      margin-left: -350px;
      opacity: 0.6;
    }
    .app-icon::before {
      content: '';
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      height: 8px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;

  <div class="app-icon"></div>
  <span class="line l1">Your apps</span>

  <script>
    (function(){
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from('.app-icon', { x: -100, opacity: 0, duration: 0.6, ease: 'power2.out' }, 0);
      tl.from('.l1', { y: 60, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.2);
      tl.from('.l2', { y: 40, opacity: 0, duration: 0.5, ease: 'power3.out' }, 0.7);

      tl.to('.line, .app-icon', { y: -40, opacity: 0, filter: 'blur(10px)', duration: 0.4, ease: 'power2.in' }, 2.4);
      tl.to({}, { duration: 3 }, 0);
      window.__timelines['pillar-1-no-replatform'] = tl;
    })();
  </script>
</div>
