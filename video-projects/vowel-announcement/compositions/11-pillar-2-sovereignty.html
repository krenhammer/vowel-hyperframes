<div data-composition-id="pillar-2-sovereignty" data-start="0" data-duration="4" data-width="1920" data-height="1080" style="width: 1920px; height: 1080px; position: absolute; display: grid; place-items: center; background: transparent;">
  <style>
    @font-face {
      font-family: 'Electrolize';
      src: url('../assets/Electrolize-Regular.ttf') format('truetype');
    }
    .line {
      font-family: 'Electrolize', sans-serif;
      position: absolute;
    }
    .l1 {
      font-size: 50px;
      color: rgba(255,255,255,0.6);
      margin-top: -130px;
    }
    .l2 {
      font-size: 110px;
      background: linear-gradient(180deg, #33d4c8 0%, #1a9a8c 100%);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(51,212,200,0.4);
      margin-top: -20px;
    }
    .l3 {
      font-size: 60px;
      background: linear-gradient(180deg, #fff 0%, #999 100%);
      -webkit-background-clip: text;
      color: transparent;
      margin-top: 100px;
    }
    .server {
      position: absolute;
      width: 60px;
      height: 100px;
      margin-left: 350px;
      border: 2px solid #33d4c8;
      border-radius: 4px;
      opacity: 0.8;
    }
    .server::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 8px;
      right: 8px;
      height: 4px;
      background: #33d4c8;
      box-shadow: 0 15px 0 #33d4c8, 0 30px 0 #33d4c8;
    }
    .lock {
      position: absolute;
      width: 50px;
      height: 60px;
      margin-left: 350px;
      margin-top: 80px;
    }
    .lock::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 25px;
      border: 4px solid #33d4c8;
      border-bottom: none;
      border-radius: 15px 15px 0 0;
    }
    .lock::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 50px;
      height: 35px;
      background: #33d4c8;
      border-radius: 4px;

  </style>
  <span class="line l1">or</span>

  <script>
    (function(){
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from('.l1', { opacity: 0, y: -20, duration: 0.4, ease: 'power2.out' }, 0);
      tl.from('.l2', { y: 60, opacity: 0, scale: 0.9, duration: 0.7, ease: 'power3.out' }, 0.3);

      tl.to('.lock', { y: -5, duration: 0.2, ease: 'power2.out', yoyo: true, repeat: 1 }, 2.0);
      tl.to('.line', { y: -50, opacity: 0, filter: 'blur(12px)', duration: 0.5, ease: 'power2.in' }, 3.3);
      tl.to('.server, .lock', { x: 80, opacity: 0, duration: 0.5, ease: 'power2.in' }, 3.3);
      tl.to({}, { duration: 4 }, 0);
      window.__timelines['pillar-2-sovereignty'] = tl;
    })();
  </script>
</div>
