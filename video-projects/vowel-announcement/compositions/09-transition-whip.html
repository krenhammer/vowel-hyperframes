<div data-composition-id="transition-whip-2" data-start="0" data-duration="1.5" data-width="1920" data-height="1080" style="width: 1920px; height: 1080px; position: absolute; overflow: hidden; background: transparent;">
  <style>
    .streak {
      position: absolute;
      top: 50%;
      left: -50%;
      width: 200%;
      height: 6px;
      background: linear-gradient(90deg, transparent, rgba(161,85,255,0.9), rgba(255,255,255,0.9), rgba(161,85,255,0.9), transparent);
      filter: blur(10px);
      transform: translateY(-50%);
    }
    .flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(161,85,255,0.25) 0%, transparent 70%);
      opacity: 0;
    }
    .speed-lines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(90deg, transparent 0 100px, rgba(161,85,255,0.1) 100px 102px, transparent 102px 200px);
      opacity: 0;
    }
  </style>
  <div class="speed-lines"></div>
  <div class="streak"></div>
  <div class="flash"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function(){
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to('.speed-lines', { opacity: 1, backgroundPosition: '200px 0', duration: 0.5, ease: 'power2.out' }, 0);
      tl.fromTo('.streak', { xPercent: -150 }, { xPercent: 150, duration: 0.5, ease: 'power4.in' }, 0.2);
      tl.to('.flash', { opacity: 1, duration: 0.15, ease: 'power2.out' }, 0.4);
      tl.to('.flash', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 0.55);
      tl.to({}, { duration: 1.5 }, 0);
      window.__timelines['transition-whip-2'] = tl;
    })();
  </script>
</div>
