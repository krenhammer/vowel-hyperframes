<div data-composition-id="transition-whip-4" data-start="0" data-duration="1.5" data-width="1920" data-height="1080" style="width: 1920px; height: 1080px; position: absolute; overflow: hidden; background: transparent;">
  <style>
    .streak {
      position: absolute;
      top: 50%;
      left: -50%;
      width: 200%;
      height: 6px;
      background: linear-gradient(90deg, transparent, rgba(51,212,200,0.9), rgba(255,255,255,0.9), rgba(51,212,200,0.9), transparent);
      filter: blur(10px);
      transform: translateY(-50%);
    }
    .flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(51,212,200,0.25) 0%, transparent 70%);
      opacity: 0;
    }
    .octocat {
      position: absolute;
      width: 80px;
      height: 80px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
    }
    .octocat::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.2);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    }
  </style>
  <div class="octocat"></div>
  <div class="streak"></div>
  <div class="flash"></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function(){
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to('.octocat', { opacity: 1, scale: 1.2, duration: 0.4, ease: 'power2.out' }, 0.2);
      tl.to('.octocat', { opacity: 0, scale: 0.8, duration: 0.3, ease: 'power2.in' }, 0.6);
      tl.fromTo('.streak', { xPercent: -150 }, { xPercent: 150, duration: 0.5, ease: 'power4.in' }, 0.2);
      tl.to('.flash', { opacity: 1, duration: 0.15, ease: 'power2.out' }, 0.4);
      tl.to('.flash', { opacity: 0, duration: 0.3, ease: 'power2.in' }, 0.55);
      tl.to({}, { duration: 1.5 }, 0);
      window.__timelines['transition-whip-4'] = tl;
    })();
  </script>
</div>
