<div data-composition-id="hook-broken" data-start="0" data-duration="2" data-width="1920" data-height="1080" style="width: 1920px; height: 1080px; position: absolute; display: grid; place-items: center; background: transparent;">
  <style>
    @font-face {
      font-family: 'Electrolize';
      src: url('../assets/Electrolize-Regular.ttf') format('truetype');
    }
    .word {
      font-family: 'Electrolize', sans-serif;
      position: absolute;
      background: linear-gradient(180deg, #fff 0%, #999 60%, #ccc 100%);
      -webkit-background-clip: text;
      color: transparent;
    }
    .w1, .w2 { font-size: 60px; }
    .w2 { margin-left: -180px; }
    .w3 {
      font-size: 180px;
      letter-spacing: 0.05em;
      text-shadow: 0 0 40px rgba(225,11,31,0.5), 0 0 80px rgba(225,11,31,0.3);
    }
    @keyframes glitch {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -2px); }
      60% { transform: translate(-2px, 0); }
      80% { transform: translate(2px, 1px); }
    }
    .glitching { animation: glitch 0.1s steps(1) infinite; }
  </style>
  <span class="word w1">is</span>
  <span class="word w2">still</span>
  <span class="word w3">broken</span>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function(){
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from('.w1', { opacity: 0, y: 20, duration: 0.4, ease: 'power2.out' }, 0);
      tl.from('.w2', { opacity: 0, y: 20, duration: 0.4, ease: 'power2.out' }, 0.2);
      tl.from('.w3', { scale: 0.5, opacity: 0, duration: 0.5, ease: 'back.out(1.4)' }, 0.5);
      tl.add(() => { document.querySelector('.w3').classList.add('glitching'); }, 0.7);
      tl.add(() => { document.querySelector('.w3').classList.remove('glitching'); }, 1.2);
      tl.to('.w3', { scale: 1.3, duration: 0.4, ease: 'power2.in' }, 0.9);
      tl.to('.word', { opacity: 0, filter: 'blur(20px)', duration: 0.3, ease: 'power2.in' }, 1.6);
      tl.to({}, { duration: 2 }, 0);
      window.__timelines['hook-broken'] = tl;
    })();
  </script>
</div>
