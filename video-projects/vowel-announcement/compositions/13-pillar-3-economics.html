<div data-composition-id="pillar-3-economics" data-start="0" data-duration="4" data-width="1920" data-height="1080" style="width: 1920px; height: 1080px; position: absolute; display: grid; place-items: center; background: transparent;">
  <style>
    @font-face {
      font-family: 'Electrolize';
      src: url('../assets/Electrolize-Regular.ttf') format('truetype');
    }
    .line {
      font-family: 'Electrolize', sans-serif;
      position: absolute;
    }
    .l1 {
      font-size: 140px;
      font-weight: bold;
      background: linear-gradient(180deg, #ff9430 0%, #e67600 100%);
      -webkit-background-clip: text;
      color: transparent;
      text-shadow: 0 0 50px rgba(255,148,48,0.5);
      margin-top: -60px;
    }
    .l2 {
      font-size: 50px;
      color: rgba(255,255,255,0.6);
      margin-top: 100px;
    }
    .comparison {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      gap: 60px;
      opacity: 0.4;
    }
    .comp-bar {
      width: 80px;
      background: rgba(255,255,255,0.2);
      transform-origin: bottom;
    }
    .comp-bar.vowel {
      background: linear-gradient(180deg, #33d4c8 0%, #1a9a8c 100%);
    }
    .comp-label {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Electrolize', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      white-space: nowrap;
    }
  </style>
  <div class="comparison">
    <div class="comp-bar" style="height: 150px;">
      <span class="comp-label">Competitors</span>
    </div>
    <div class="comp-bar vowel" style="height: 40px;">
      <span class="comp-label">vowel</span>
    </div>
  </div>
  <span class="line l1">4× less</span>
  <span class="line l2">expensive</span>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function(){
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.from('.comp-bar', { scaleY: 0, duration: 0.8, ease: 'power3.out', stagger: 0.15 }, 0.3);
      tl.from('.l1', { scale: 0.5, opacity: 0, duration: 0.7, ease: 'back.out(1.4)' }, 0.3);
      tl.to('.l1', { textShadow: '0 0 70px rgba(255,148,48,0.8), 0 0 100px rgba(255,148,48,0.5)', duration: 0.3, ease: 'power2.out', yoyo: true, repeat: 1 }, 1.0);
      tl.from('.l2', { y: 30, opacity: 0, duration: 0.5, ease: 'power2.out' }, 1.0);
      tl.to('.comp-bar.vowel', { opacity: 1, duration: 0.3, ease: 'power2.out', yoyo: true, repeat: 3 }, 1.5);
      tl.to('.line', { y: -60, opacity: 0, filter: 'blur(15px)', duration: 0.5, ease: 'power2.in' }, 3.3);
      tl.to('.comparison', { opacity: 0, y: 50, duration: 0.5, ease: 'power2.in' }, 3.3);
      tl.to({}, { duration: 4 }, 0);
      window.__timelines['pillar-3-economics'] = tl;
    })();
  </script>
</div>
