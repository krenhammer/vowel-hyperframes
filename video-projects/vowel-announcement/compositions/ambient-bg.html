<div data-composition-id="ambient-bg" data-start="0" data-duration="60" data-width="1920" data-height="1080" style="width: 1920px; height: 1080px; position: absolute; background: #000; overflow: hidden;">
  <style>
    .grid-floor {
      position: absolute;
      inset: 0;
      transform: perspective(900px) rotateX(60deg) translateY(20%);
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 80px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 80px);
      background-color: #000;
    }
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, #000 95%);
      animation: vignette-breathe 4s ease-in-out infinite;
    }
    @keyframes vignette-breathe {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.95; }
    }
    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      10% { transform: translate(-5%, -5%); }
      20% { transform: translate(-10%, 5%); }
      30% { transform: translate(5%, -10%); }
      40% { transform: translate(-5%, 15%); }
      50% { transform: translate(-10%, 5%); }
      60% { transform: translate(15%, 0); }
      70% { transform: translate(0, 10%); }
      80% { transform: translate(-15%, 0); }
      90% { transform: translate(10%, 5%); }
    }
    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 100;
    }
    .grain-inner {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      opacity: 0.12;
      animation: grain 0.5s steps(1) infinite;
    }
    .crosshair {
      position: absolute;
      width: 20px;
      height: 20px;
    }
    .crosshair::before, .crosshair::after {
      content: '';
      position: absolute;
      background: rgba(255,255,255,0.08);
    }
    .crosshair::before {
      width: 1px;
      height: 100%;
      left: 50%;
      transform: translateX(-50%);
    }
    .crosshair::after {
      width: 100%;
      height: 1px;
      top: 50%;
      transform: translateY(-50%);
    }
  </style>
  <div class="grid-floor"></div>
  <div class="crosshair" style="top: 30%; left: 20%;"></div>
  <div class="crosshair" style="top: 30%; left: 40%;"></div>
  <div class="crosshair" style="top: 30%; left: 60%;"></div>
  <div class="crosshair" style="top: 30%; left: 80%;"></div>
  <div class="crosshair" style="top: 50%; left: 30%;"></div>
  <div class="crosshair" style="top: 50%; left: 50%;"></div>
  <div class="crosshair" style="top: 50%; left: 70%;"></div>
  <div class="crosshair" style="top: 70%; left: 20%;"></div>
  <div class="crosshair" style="top: 70%; left: 40%;"></div>
  <div class="crosshair" style="top: 70%; left: 60%;"></div>
  <div class="crosshair" style="top: 70%; left: 80%;"></div>
  <div class="vignette"></div>
  <div class="grain"><div class="grain-inner"></div></div>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function(){
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.to('.grid-floor', { backgroundPosition: '0 120px', duration: 20, ease: 'none' }, 0);
      tl.fromTo('.crosshair', { opacity: 0.05 }, { opacity: 0.12, duration: 2, ease: 'sine.inOut', stagger: { each: 0.3, from: 'random' }, repeat: 29, yoyo: true }, 0);
      tl.to({}, { duration: 60 }, 0);
      window.__timelines['ambient-bg'] = tl;
    })();
  </script>
</div>
