<div
  data-composition-id="comp-codespace"

  data-duration="9"
  data-width="1920"

  style="position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden"

  <div class="chrome">
    <div
      class="viewport"
      data-mock-qz="1"

        <div class="f-item" id="f-a"><div class="abs-bar fi a"></div></div>
        <div class="f-item" id="f-env"><div class="abs-bar fi b"></div></div>
        <div class="f-item dim"><div class="abs-bar fi c"></div></div>
      </aside>
      <div class="center">
        <div class="tabs">
          <div class="tab clip" id="tab-tsx"><div class="abs-bar tab-bar"></div></div>
          <div class="tab clip" id="tab-env"><div class="abs-bar tab-bar short"></div></div>
        </div>
        <div class="editor">
          <div class="code-block" id="blk-tsx">

            <div class="c-line indent"><span class="line-bar g2"></span></div>
            <div class="c-line indent"><span class="line-bar g3"></span></div>
            <div class="c-line indent"><span class="line-bar g4"></span></div>

            <div class="c-line"><span class="line-bar val" id="env-val-bar"></span></div>
            <div class="c-line dim"><span class="line-bar k2"></span></div>
            <div class="c-line dim"><span class="line-bar v2"></span></div>
          </div>
        </div>
      </div>
      <aside class="preview">
        <div class="pv-h"><div class="abs-bar pv-lbl"></div></div>
        <div class="pv-frame clip" id="pv-scroll">
          <div class="mock-page">
            <div class="mock-nav"></div>
            <div class="mock-hero"></div>
            <div class="mock-row"></div>
            <div class="mock-row short"></div>
            <div class="mock-row"></div>
          </div>
        </div>
      </aside>
    </div>
  </div>
  <style>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="compositions/components/mock-quadrant-tour.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      var root = '[data-composition-id="comp-codespace"]';
      var vp = root + " .viewport";

      tl.from(vp, { autoAlpha: 0, y: 20, duration: 0.5 }, 0.1);

      tl.set(root + " #f-a", { backgroundColor: "rgba(37,99,235,0.22)" }, 0);
      tl.set(root + " #f-env", { backgroundColor: "transparent" }, 0);
      tl.set(root + " #tab-tsx", { backgroundColor: "#1a2332" }, 0);
      tl.set(root + " #tab-env", { backgroundColor: "transparent" }, 0);

      tl.from(root + " #blk-tsx .c-line", { autoAlpha: 0, x: -14, duration: 0.3, stagger: 0.09, ease: "expo.out" }, 0.3);

      if (typeof window.hfAddMockQuadrantTour === "function") {
        window.hfAddMockQuadrantTour(tl, vp, 0.35, { scale: 2, holdAfterNW: 1, zoomInDuration: 0.75, panDuration: 0.7 });
      }

      tl.to(root + " #pv-scroll .mock-page", { y: -56, duration: 1.35, ease: "power2.inOut" }, 4.9);

      tl.to(root + " #f-a", { backgroundColor: "transparent", duration: 0.22, ease: "power2.inOut" }, 4.9);
      tl.to(
        root + " #f-env",
        { backgroundColor: "rgba(37,99,235,0.28)", duration: 0.25, ease: "power2.inOut" },
        4.9
      );
      tl.to(root + " #tab-tsx", { backgroundColor: "transparent", duration: 0.22, ease: "power2.inOut" }, 4.92);
      tl.to(
        root + " #tab-env",
        { backgroundColor: "#1a2332", duration: 0.25, ease: "power2.inOut" },
        4.92
      );

      tl.to(root + " #blk-tsx", { autoAlpha: 0, y: -8, duration: 0.28, ease: "power2.in" }, 4.9);
      tl.fromTo(
        root + " #blk-env",
        { autoAlpha: 0, y: 12, visibility: "visible" },
        { autoAlpha: 1, y: 0, visibility: "visible", duration: 0.4, ease: "power2.out" },
        5
      );

      tl.fromTo(
        root + " #env-val-bar",
        { width: "0%" },
        { width: "58%", duration: 1.25, ease: "none" },
        5.2
      );

      tl.set({}, {}, 9);
      window.__timelines["comp-codespace"] = tl;
    })();
  </script>
