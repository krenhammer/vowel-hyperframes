>

            <div class="tree-line clip" id="rag-tr-4">

            <div class="bubble user clip" id="rag-u1">

  <style>
    [data-composition-id="comp-rag-modal"] {
      background: transparent;
      font-family: "DM Sans", system-ui, sans-serif;
      color: #e6edf3;
    }
    [data-composition-id="comp-rag-modal"] .abs-bar {
      display: block;
      height: 11px;
      border-radius: 5px;
      background: #64748b;
    }
    [data-composition-id="comp-rag-modal"] .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.55);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
    }
    /* Align with voweldocs .chrome: left 320px; FAB at left+28, bottom+28 */
    [data-composition-id="comp-rag-modal"] .modal-anchor {
      position: absolute;
      z-index: 60;
      left: 320px;
      bottom: 28px;
      padding-left: 28px;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      pointer-events: none;
    }
    [data-composition-id="comp-rag-modal"] .modal {
      position: relative;
      width: 720px;
      max-height: min(78vh, 600px);
      transform: scale(0.94);
      transform-origin: left bottom;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
      padding: 0 0 16px;
      opacity: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }
    [data-composition-id="comp-rag-modal"] .modal-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: #2563eb;
      border-bottom: none;
      border-radius: 14px 14px 0 0;
      flex-shrink: 0;
    }
    [data-composition-id="comp-rag-modal"] .mh-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.02em;
    }
    [data-composition-id="comp-rag-modal"] .mh-x {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.25);
    }
    [data-composition-id="comp-rag-modal"] .rag-tabrow {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid #334155;
      background: #0c1322;
      flex-shrink: 0;
    }
    [data-composition-id="comp-rag-modal"] .rag-tab {
      flex: 1;

      font-size: 15px;
      font-weight: 600;

      color: #94a3b8;
      border-bottom: 3px solid transparent;

    [data-composition-id="comp-rag-modal"] .rag-tab.is-active {
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.85);
      border-bottom-color: #60a5fa;
    }
    [data-composition-id="comp-rag-modal"] .rag-panes {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      min-height: 280px;
      flex: 1;
    }
    [data-composition-id="comp-rag-modal"] .rag-pane.docs {
      flex: 0 0 44%;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    [data-composition-id="comp-rag-modal"] .rag-divider {
      width: 1px;
      background: #334155;
      flex-shrink: 0;
    }
    [data-composition-id="comp-rag-modal"] .rag-pane.chat-side {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    [data-composition-id="comp-rag-modal"] .doc-tree {
      padding: 16px 14px 18px 12px;

      gap: 10px;

    [data-composition-id="comp-rag-modal"] .tree-line {
      display: flex;

    [data-composition-id="comp-rag-modal"] .tree-line.inner {

    [data-composition-id="comp-rag-modal"] .doc-tree .tw {
      flex: 1;
    }
    [data-composition-id="comp-rag-modal"] .doc-tree .w95 {

    [data-composition-id="comp-rag-modal"] .doc-tree .w88 {
      width: 88%;

    [data-composition-id="comp-rag-modal"] .doc-tree .w80 {
      width: 80%;
    }
    [data-composition-id="comp-rag-modal"] .doc-tree .w70 {

    }
    [data-composition-id="comp-rag-modal"] .doc-tree .w60 {
      width: 60%;
    }
    [data-composition-id="comp-rag-modal"] .chat {
      padding: 12px 14px 4px 12px;

      flex-direction: column;

      flex-direction: column;

    }
    [data-composition-id="comp-rag-modal"] .b-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    [data-composition-id="comp-rag-modal"] .bb {
      width: 100%;
    }
    [data-composition-id="comp-rag-modal"] .bb.w70 {
      width: 70%;
    }
    [data-composition-id="comp-rag-modal"] .bb.w90 {
      width: 92%;

      width: 80%;

      width: 55%;

    [data-composition-id="comp-rag-modal"] .bubble.ai {

      border: 1px solid #334155;
    }
    [data-composition-id="comp-rag-modal"] .bubble.ai .abs-bar {

      gap: 8px;
    }

      width: 100%;

    [data-composition-id="comp-rag-modal"] .gn {

    }
    [data-composition-id="comp-rag-modal"] .gn.dash {
      width: 20px;
      background: #475569;
    }
    [data-composition-id="comp-rag-modal"] .g-bar {
      height: 8px;
      border-radius: 999px;
      background: #1e293b;
      overflow: hidden;
      display: block;
    }
    [data-composition-id="comp-rag-modal"] .g-fill {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transform-origin: left center;
      transform: scaleX(0.02);
      width: 100%;
    }
    [data-composition-id="comp-rag-modal"] .g-fill.mid {
      background: linear-gradient(90deg, #eab308, #facc15);
    }
    [data-composition-id="comp-rag-modal"] .g-fill.low {
      background: linear-gradient(90deg, #f97316, #fb923c);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      var root = '[data-composition-id="comp-rag-modal"]';

      tl.to(root + " #rag-back", { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 0.1);
      tl.to(root + " #rag-modal", { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.2)" }, 0.2);
      tl.from(
        root + " #rag-doc-tree .tree-line",
        { autoAlpha: 0, x: -8, duration: 0.28, stagger: 0.08 },
        0.45
      );
      tl.from(root + " #rag-u1", { autoAlpha: 0, x: 24, duration: 0.35 }, 0.6);
      tl.from(root + " #rag-a1", { autoAlpha: 0, x: -20, duration: 0.35 }, 0.8);
      tl.from(root + " #rag-grades .grade-row", { autoAlpha: 0, y: 10, duration: 0.32, stagger: 0.1 }, 1.1);
      tl.to(
        root + " #rag-grades .g-fill",
        { scaleX: 1, duration: 0.65, ease: "power2.out", stagger: 0.12, transformOrigin: "left center" },
        1.3
      );

      tl.to(root + " #rag-modal", { autoAlpha: 0, scale: 0.96, duration: 0.35, ease: "power3.in" }, 2.6);
      tl.to(root + " #rag-back", { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 2.7);

      tl.to(root + " #rag-back", { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 3.3);
      tl.to(root + " #rag-modal", { autoAlpha: 1, scale: 1, duration: 0.42, ease: "back.out(1.15)" }, 3.35);
      tl.add(function () {
        var a = document.querySelector(root + " #rag-tab-a");
        var b = document.querySelector(root + " #rag-tab-b");
        if (a) a.classList.remove("is-active");
        if (b) b.classList.add("is-active");
      }, 3.35);
      tl.from(root + " #rag-u2", { autoAlpha: 0, x: 22, duration: 0.32 }, 3.7);
      tl.from(root + " #rag-grades-2 .grade-row", { autoAlpha: 0, y: 8, duration: 0.28, stagger: 0.08 }, 3.9);
      tl.to(
        root + " #rag-grades-2 .g-fill",
        { scaleX: 1, duration: 0.55, ease: "power2.out", stagger: 0.1, transformOrigin: "left center" },
        4.1
      );
      tl.to(root + " #g2n0", { scaleX: 1.15, backgroundColor: "#cbd5e1", duration: 0.25 }, 4.4);
      tl.to(root + " #g2n1", { scaleX: 1.15, backgroundColor: "#cbd5e1", duration: 0.25 }, 4.47);

      tl.to(root + " #rag-modal", { autoAlpha: 0, y: 24, duration: 0.38, ease: "power3.in" }, 5.3);
      tl.to(root + " #rag-back", { autoAlpha: 0, duration: 0.28, ease: "power2.in" }, 5.37);

      tl.set({}, {}, 8);
      window.__timelines["comp-rag-modal"] = tl;
    })();
  </script>
</div>
