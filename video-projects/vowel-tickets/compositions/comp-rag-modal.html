<div
  data-composition-id="comp-rag-modal"
  data-start="0"
  data-duration="8"
  data-width="1920"
  data-height="1080"
  style="position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden"
>
  <!-- Overlay only: voweldocs stays visible underneath (stacked scene in index.html) -->
  <div class="modal-backdrop clip" id="rag-back"></div>
  <div class="modal-center clip" id="rag-modal-wrap">
    <div class="modal clip" id="rag-modal">
      <div class="modal-h">
        <span class="mh-title">Turso Browser RAG</span>
        <div class="abs-bar mh-x"></div>
      </div>
      <div class="chat" id="rag-chat">
        <div class="bubble user clip" id="rag-u1"><div class="b-stack"><div class="abs-bar bb"></div><div class="abs-bar bb w70"></div></div></div>
        <div class="bubble ai clip" id="rag-a1"><div class="b-stack"><div class="abs-bar bb w90"></div><div class="abs-bar bb w80"></div><div class="abs-bar bb w55"></div></div></div>
      </div>
      <div class="grades clip" id="rag-grades">
        <div class="grade-row">
          <div class="abs-bar gl"></div>
          <span class="g-bar"><span class="g-fill"></span></span>
          <div class="abs-bar gn"></div>
        </div>
        <div class="grade-row">
          <div class="abs-bar gl short"></div>
          <span class="g-bar"><span class="g-fill mid"></span></span>
          <div class="abs-bar gn"></div>
        </div>
        <div class="grade-row">
          <div class="abs-bar gl med"></div>
          <span class="g-bar"><span class="g-fill low"></span></span>
          <div class="abs-bar gn"></div>
        </div>
      </div>
      <div class="chat-2 clip" id="rag-chat-2">
        <div class="bubble user clip" id="rag-u2"><div class="abs-bar bb w40"></div></div>
        <div class="grades mini clip" id="rag-grades-2">
          <div class="grade-row">
            <div class="abs-bar gl tiny"></div>
            <span class="g-bar"><span class="g-fill"></span></span>
            <div class="abs-bar gn dash" id="g2n0"></div>
          </div>
          <div class="grade-row">
            <div class="abs-bar gl tiny"></div>
            <span class="g-bar"><span class="g-fill mid"></span></span>
            <div class="abs-bar gn dash" id="g2n1"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <style>
    [data-composition-id="comp-rag-modal"] {
      background: transparent;
      font-family: "DM Sans", system-ui, sans-serif;
      color: #e6edf3;
    }
    [data-composition-id="comp-rag-modal"] .abs-bar {
      display: block;
      height: 11px;
      border-radius: 5px;
      background: #64748b;
    }
    [data-composition-id="comp-rag-modal"] .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.55);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
    }
    [data-composition-id="comp-rag-modal"] .modal-center {
      position: absolute;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    [data-composition-id="comp-rag-modal"] .modal {
      position: relative;
      width: 640px;
      max-height: 78%;
      transform: scale(0.94);
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.55);
      padding: 0 0 20px;
      opacity: 0;
      pointer-events: none;
    }
    [data-composition-id="comp-rag-modal"] .modal-h {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: #2563eb;
      border-bottom: none;
      border-radius: 14px 14px 0 0;
    }
    [data-composition-id="comp-rag-modal"] .mh-title {
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.01em;
    }
    [data-composition-id="comp-rag-modal"] .mh-x {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.25);
    }
    [data-composition-id="comp-rag-modal"] .chat {
      padding: 18px 22px 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    [data-composition-id="comp-rag-modal"] .chat-2 {
      padding: 0 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    [data-composition-id="comp-rag-modal"] .b-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    [data-composition-id="comp-rag-modal"] .bb {
      width: 100%;
    }
    [data-composition-id="comp-rag-modal"] .bb.w70 {
      width: 70%;
    }
    [data-composition-id="comp-rag-modal"] .bb.w90 {
      width: 92%;
    }
    [data-composition-id="comp-rag-modal"] .bb.w80 {
      width: 80%;
    }
    [data-composition-id="comp-rag-modal"] .bb.w55 {
      width: 55%;
    }
    [data-composition-id="comp-rag-modal"] .bb.w40 {
      width: 42%;
    }
    [data-composition-id="comp-rag-modal"] .bubble {
      max-width: 88%;
      padding: 14px 16px;
      border-radius: 12px;
    }
    [data-composition-id="comp-rag-modal"] .bubble.user {
      align-self: flex-end;
      background: #2563eb;
    }
    [data-composition-id="comp-rag-modal"] .bubble.user .abs-bar {
      background: rgba(255, 255, 255, 0.45);
    }
    [data-composition-id="comp-rag-modal"] .bubble.ai {
      align-self: flex-start;
      background: #1e293b;
      border: 1px solid #334155;
    }
    [data-composition-id="comp-rag-modal"] .bubble.ai .abs-bar {
      background: #64748b;
    }
    [data-composition-id="comp-rag-modal"] .grades {
      padding: 8px 22px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    [data-composition-id="comp-rag-modal"] .grades.mini {
      padding: 0;
    }
    [data-composition-id="comp-rag-modal"] .grade-row {
      display: grid;
      grid-template-columns: 120px 1fr 40px;
      align-items: center;
      gap: 12px;
    }
    [data-composition-id="comp-rag-modal"] .gl {
      width: 100%;
    }
    [data-composition-id="comp-rag-modal"] .gl.short {
      width: 70%;
    }
    [data-composition-id="comp-rag-modal"] .gl.med {
      width: 85%;
    }
    [data-composition-id="comp-rag-modal"] .gl.tiny {
      width: 90%;
    }
    [data-composition-id="comp-rag-modal"] .gn {
      width: 28px;
      margin-left: auto;
      height: 10px;
    }
    [data-composition-id="comp-rag-modal"] .gn.dash {
      width: 22px;
      background: #475569;
    }
    [data-composition-id="comp-rag-modal"] .g-bar {
      height: 8px;
      border-radius: 999px;
      background: #1e293b;
      overflow: hidden;
      display: block;
    }
    [data-composition-id="comp-rag-modal"] .g-fill {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transform-origin: left center;
      transform: scaleX(0.02);
      width: 100%;
    }
    [data-composition-id="comp-rag-modal"] .g-fill.mid {
      background: linear-gradient(90deg, #eab308, #facc15);
    }
    [data-composition-id="comp-rag-modal"] .g-fill.low {
      background: linear-gradient(90deg, #f97316, #fb923c);
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      var root = '[data-composition-id="comp-rag-modal"]';

      /* Timings shifted after removing duplicate chrome + lower-left RAG FAB (single FAB lives on comp-voweldocs) */
      tl.to(root + " #rag-back", { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 0.1);
      tl.to(root + " #rag-modal", { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.2)" }, 0.2);

      tl.from(root + " #rag-u1", { autoAlpha: 0, x: 24, duration: 0.35 }, 0.6);
      tl.from(root + " #rag-a1", { autoAlpha: 0, x: -20, duration: 0.35 }, 0.8);
      tl.from(root + " #rag-grades .grade-row", { autoAlpha: 0, y: 10, duration: 0.32, stagger: 0.1 }, 1.1);
      tl.to(
        root + " #rag-grades .g-fill",
        { scaleX: 1, duration: 0.65, ease: "power2.out", stagger: 0.12, transformOrigin: "left center" },
        1.3
      );

      tl.to(root + " #rag-modal", { autoAlpha: 0, scale: 0.96, duration: 0.35, ease: "power3.in" }, 2.6);
      tl.to(root + " #rag-back", { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 2.7);

      tl.to(root + " #rag-back", { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 3.3);
      tl.to(root + " #rag-modal", { autoAlpha: 1, scale: 1, duration: 0.42, ease: "back.out(1.15)" }, 3.35);
      tl.from(root + " #rag-u2", { autoAlpha: 0, x: 22, duration: 0.32 }, 3.7);
      tl.from(root + " #rag-grades-2 .grade-row", { autoAlpha: 0, y: 8, duration: 0.28, stagger: 0.08 }, 3.9);
      tl.to(
        root + " #rag-grades-2 .g-fill",
        { scaleX: 1, duration: 0.55, ease: "power2.out", stagger: 0.1, transformOrigin: "left center" },
        4.1
      );
      tl.to(root + " #g2n0", { scaleX: 1.15, backgroundColor: "#cbd5e1", duration: 0.25 }, 4.4);
      tl.to(root + " #g2n1", { scaleX: 1.15, backgroundColor: "#cbd5e1", duration: 0.25 }, 4.47);

      tl.to(root + " #rag-modal", { autoAlpha: 0, y: 24, duration: 0.38, ease: "power3.in" }, 5.3);
      tl.to(root + " #rag-back", { autoAlpha: 0, duration: 0.28, ease: "power2.in" }, 5.37);

      tl.set({}, {}, 8);
      window.__timelines["comp-rag-modal"] = tl;
    })();
  </script>
</div>
