<div

  data-width="1920"
  data-height="1080"
  style="position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden"
>
  <div class="chrome">
    <div class="viewport">

        <div class="grade-row"><span class="g-lbl">blog-post</span><span class="g-bar"><span class="g-fill low" style="width: 31%"></span></span><span class="g-num">0.31</span></div>
      </div>
      <div class="chat-2 clip" id="rag-chat-2">
        <div class="bubble user clip" id="rag-u2">█ █</div>
        <div class="grades mini clip" id="rag-grades-2">
          <div class="grade-row"><span class="g-lbl">chunk-12</span><span class="g-bar"><span class="g-fill" style="width: 0%"></span></span><span class="g-num">—</span></div>
          <div class="grade-row"><span class="g-lbl">chunk-04</span><span class="g-bar"><span class="g-fill mid" style="width: 0%"></span></span><span class="g-num">—</span></div>
        </div>
      </div>
      </div>
    </div>
  </div>
  <style>
    [data-composition-id="comp-rag-modal"] {
      background: #0f1419;
      font-family: "DM Sans", system-ui, sans-serif;
      color: #e6edf3;
    }
    [data-composition-id="comp-rag-modal"] .chrome {
      position: absolute;
      inset: 0;
    }
    [data-composition-id="comp-rag-modal"] .viewport {
      position: absolute;
      inset: 48px;
      border-radius: 12px;
      border: 1px solid #2d3a4f;
      background: #1a2332;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transform-origin: 50% 50%;
    }
    [data-composition-id="comp-rag-modal"] .mini-nav {
      display: flex;

      z-index: 40;

    }
    [data-composition-id="comp-rag-modal"] .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.55);
      z-index: 50;

    [data-composition-id="comp-rag-modal"] .modal-center {

      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    [data-composition-id="comp-rag-modal"] .modal {
      position: relative;

      max-height: 78%;
      transform: scale(0.94);
      background: #0f172a;
      border: 1px solid #334155;

    [data-composition-id="comp-rag-modal"] .modal-h {

      align-items: center;

      border-bottom: 1px solid #334155;
      font-weight: 700;
      font-size: 18px;

    [data-composition-id="comp-rag-modal"] .modal-x {

    [data-composition-id="comp-rag-modal"] .chat {
      padding: 18px 22px 8px;

      flex-direction: column;

      line-height: 1.45;

    [data-composition-id="comp-rag-modal"] .bubble.user {
      align-self: flex-end;

      padding: 0;
    }
    [data-composition-id="comp-rag-modal"] .grade-row {
      display: grid;
      grid-template-columns: 120px 1fr 48px;
      align-items: center;
      gap: 12px;
      font-size: 14px;
    }
    [data-composition-id="comp-rag-modal"] .g-lbl {
      color: #94a3b8;
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 13px;
    }
    [data-composition-id="comp-rag-modal"] .g-bar {
      height: 8px;
      border-radius: 999px;
      background: #1e293b;
      overflow: hidden;
    }
    [data-composition-id="comp-rag-modal"] .g-fill {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transform-origin: left center;
      transform: scaleX(0.02);
    }
    [data-composition-id="comp-rag-modal"] .g-fill.mid {
      background: linear-gradient(90deg, #eab308, #facc15);
    }
    [data-composition-id="comp-rag-modal"] .g-fill.low {
      background: linear-gradient(90deg, #f97316, #fb923c);
    }
    [data-composition-id="comp-rag-modal"] .g-num {
      text-align: right;
      color: #e2e8f0;
      font-variant-numeric: tabular-nums;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      var root = '[data-composition-id="comp-rag-modal"]';

      tl.from(root + " .viewport", { autoAlpha: 0, y: 16, duration: 0.48 }, 0.1);
      tl.from(root + " #rag-fab", { autoAlpha: 0, scale: 0.86, duration: 0.4, ease: "back.out(1.4)" }, 0.35);

      tl.to(
        root + " .viewport",
        { scale: 1.06, xPercent: 3, yPercent: -3, duration: 0.55, ease: "power2.inOut", transformOrigin: "100% 0%" },
        0.55
      );
      tl.to(
        root + " .viewport",
        { scale: 1.06, xPercent: -3, yPercent: 3, duration: 0.55, ease: "power2.inOut", transformOrigin: "0% 100%" },
        1.15
      );
      tl.to(root + " .viewport", { scale: 1, xPercent: 0, yPercent: 0, duration: 0.45, ease: "power3.out" }, 1.75);

      tl.to(root + " #rag-back", { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 1.85);
      tl.to(root + " #rag-modal", { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.2)" }, 1.95);

      tl.from(root + " #rag-u1", { autoAlpha: 0, x: 24, duration: 0.35 }, 2.35);
      tl.from(root + " #rag-a1", { autoAlpha: 0, x: -20, duration: 0.35 }, 2.55);
      tl.from(root + " #rag-grades .grade-row", { autoAlpha: 0, y: 10, duration: 0.32, stagger: 0.1 }, 2.85);
      tl.to(
        root + " #rag-grades .g-fill",
        { scaleX: 1, duration: 0.65, ease: "power2.out", stagger: 0.12, transformOrigin: "left center" },
        3.05
      );

      tl.to(root + " #rag-modal", { autoAlpha: 0, scale: 0.96, duration: 0.35, ease: "power3.in" }, 4.35);
      tl.to(root + " #rag-back", { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 4.45);

      tl.to(root + " #rag-back", { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 5.05);
      tl.to(root + " #rag-modal", { autoAlpha: 1, scale: 1, duration: 0.42, ease: "back.out(1.15)" }, 5.1);
      tl.from(root + " #rag-u2", { autoAlpha: 0, x: 22, duration: 0.32 }, 5.45);
      tl.from(root + " #rag-grades-2 .grade-row", { autoAlpha: 0, y: 8, duration: 0.28, stagger: 0.08 }, 5.65);
      tl.to(
        root + " #rag-grades-2 .g-fill",
        { scaleX: 1, duration: 0.55, ease: "power2.out", stagger: 0.1, transformOrigin: "left center" },
        5.85
      );
      tl.add(function () {
        var nums = document.querySelectorAll(root + " #rag-grades-2 .g-num");
        if (nums[0]) nums[0].textContent = "0.88";
        if (nums[1]) nums[1].textContent = "0.57";
      }, 6.15);

      tl.to(root + " #rag-modal", { autoAlpha: 0, y: 24, duration: 0.38, ease: "power3.in" }, 7.05);
      tl.to(root + " #rag-back", { autoAlpha: 0, duration: 0.28, ease: "power2.in" }, 7.12);

      tl.set({}, {}, 8);
      window.__timelines["comp-rag-modal"] = tl;
    })();
  </script>
</div>
