<div
  data-composition-id="comp-api-modal"
  data-start="0"
  data-duration="7"
  data-width="1920"
  data-height="1080"
  style="position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden"
>
  <!-- Overlay only: voweldocs stays visible underneath -->
  <div class="backdrop clip" id="api-back"></div>
  <div class="modal-center clip" id="api-modal-wrap">
    <div class="modal clip" id="api-modal">
      <div class="mh-row clip" id="api-mh-row">
        <h2 class="mh" id="api-title">Configure <span class="ocr">voweldocs</span></h2>
        <button type="button" class="ico-btn clip" id="api-close" aria-label="Close">
          <div class="abs-bar close-bar"></div>
        </button>
      </div>
      <div class="tabs clip" id="api-tabs" role="tablist">
        <button type="button" class="tab active" id="api-tab-saas" role="tab" aria-selected="true">Hosted (SaaS)</button>
        <button type="button" class="tab" id="api-tab-host" role="tab" aria-selected="false">Self-Hosted</button>
      </div>
      <div class="lbl clip" id="api-lbl-app">
        <div class="abs-bar lbl-w"></div>
      </div>
      <div class="field clip" id="api-f-app">
        <div class="abs-bar fld-w"></div>
      </div>
      <div class="lbl clip" id="api-lbl-key">
        <div class="abs-bar lbl-w key-lbl"></div>
      </div>
      <div class="field key-field clip" id="api-f-key">
        <div class="key-sweep clip" id="api-key-sweep" aria-hidden="true">
          <div class="key-chunk abs-bar sec"></div>
          <div class="key-chunk abs-bar sec k2"></div>
          <div class="key-chunk abs-bar sec k3"></div>
          <div class="key-chunk abs-bar sec k4"></div>
          <div class="key-chunk abs-bar sec k5"></div>
        </div>
        <div class="eye-r clip" id="api-eye-r" aria-hidden="true"><div class="abs-bar eye-b"></div></div>
      </div>
      <div class="hint clip" id="api-hint">
        <div class="abs-bar hint-1"></div>
      </div>
      <div class="btn-row clip" id="api-btn-row">
        <button type="button" class="text-btn text-btn--primary clip" id="api-save-wrap" aria-label="Save and enable">
          <span class="abs-bar abs-slab abs-slab--primary" aria-hidden="true"></span>
        </button>
        <button type="button" class="text-btn text-btn--remove clip" id="api-remove-wrap" aria-label="Remove">
          <span class="abs-bar abs-slab abs-slab--remove" aria-hidden="true"></span>
        </button>
      </div>
      <button class="start-vowel clip" id="api-start-vowel" type="button">Start vowel session</button>
      <button type="button" class="text-btn text-btn--ghost clip" id="api-clear" aria-label="Clear saved configuration">
        <span class="abs-bar abs-slab abs-slab--ghost" aria-hidden="true"></span>
      </button>
    </div>
  </div>
  <style>
    @font-face {
      font-family: "OCR A Std";
      src: url("../assets/OCR-A_Regular.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    [data-composition-id="comp-api-modal"] {
      background: transparent;
      font-family: "DM Sans", system-ui, sans-serif;
      color: #e6edf3;
    }
    [data-composition-id="comp-api-modal"] .ocr {
      font-family: "OCR A Std", "OCR A", ui-monospace, monospace;
      font-weight: 400;
      letter-spacing: 0.06em;
    }
    [data-composition-id="comp-api-modal"] .abs-bar {
      display: block;
      width: 100%;
      height: 10px;
      border-radius: 5px;
      background: #64748b;
    }
    [data-composition-id="comp-api-modal"] .abs-bar.sec {
      background: #ca8a04;
      opacity: 0.9;
    }
    [data-composition-id="comp-api-modal"] .ico-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      margin: -6px -8px 0 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      border-radius: 8px;
      background: transparent;
      cursor: default;
    }
    [data-composition-id="comp-api-modal"] .ico-btn .close-bar {
      width: 16px;
      height: 16px;
    }
    [data-composition-id="comp-api-modal"] .text-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      border: none;
      border-radius: 10px;
      font: inherit;
      cursor: default;
    }
    [data-composition-id="comp-api-modal"] .text-btn--primary {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 48px;
      background: linear-gradient(180deg, #3b82f6, #2563eb);
      box-shadow: 0 4px 0 #1d4ed8;
    }
    [data-composition-id="comp-api-modal"] .text-btn--remove {
      flex: 0 0 120px;
      min-height: 48px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid #ef4444;
      box-shadow: none;
    }
    [data-composition-id="comp-api-modal"] .text-btn--ghost {
      width: 100%;
      min-height: 36px;
      margin-top: 10px;
      background: #111827;
      border: 1px solid #334155;
    }
    /* Single abstract “text” block per button (one horizontal slab) */
    [data-composition-id="comp-api-modal"] .abs-slab {
      display: block;
      width: 72%;
      height: 12px;
      margin: 0 auto;
    }
    [data-composition-id="comp-api-modal"] .text-btn--remove .abs-slab {
      width: 64%;
    }
    [data-composition-id="comp-api-modal"] .text-btn--ghost .abs-slab--ghost {
      width: 40%;
    }
    [data-composition-id="comp-api-modal"] .abs-slab--primary {
      background: rgba(241, 245, 249, 0.95);
    }
    [data-composition-id="comp-api-modal"] .abs-slab--remove {
      background: #fecaca;
    }
    [data-composition-id="comp-api-modal"] .abs-slab--ghost {
      background: #94a3b8;
    }
    [data-composition-id="comp-api-modal"] .backdrop {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.62);
      z-index: 50;
      opacity: 0;
    }
    [data-composition-id="comp-api-modal"] .modal-center {
      position: absolute;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    [data-composition-id="comp-api-modal"] .modal {
      position: relative;
      width: 520px;
      max-width: calc(100% - 48px);
      transform: scale(0.92);
      background: #0b1220;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px 28px 26px;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.55);
      opacity: 0;
      pointer-events: none;
    }
    [data-composition-id="comp-api-modal"] .mh-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid #1e293b;
    }
    [data-composition-id="comp-api-modal"] .mh {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.3;
      color: #f8fafc;
      margin: 0;
    }
    [data-composition-id="comp-api-modal"] .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    [data-composition-id="comp-api-modal"] .tab {
      flex: 1;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #111827;
      color: #94a3b8;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: default;
    }
    [data-composition-id="comp-api-modal"] .tab.active {
      background: #1e293b;
      border-color: #3b82f6;
      color: #3b82f6;
    }
    [data-composition-id="comp-api-modal"] .lbl {
      margin-bottom: 8px;
    }
    [data-composition-id="comp-api-modal"] #api-lbl-key {
      margin-top: 12px;
    }
    [data-composition-id="comp-api-modal"] .lbl .lbl-w {
      width: 22%;
    }
    [data-composition-id="comp-api-modal"] .lbl .key-lbl {
      width: 30%;
    }
    [data-composition-id="comp-api-modal"] .field {
      height: 44px;
      border-radius: 10px;
      background: #111827;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      padding: 0 12px 0 14px;
    }
    [data-composition-id="comp-api-modal"] .fld-w {
      width: 88%;
    }
    [data-composition-id="comp-api-modal"] .key-field {
      justify-content: space-between;
      gap: 10px;
    }
    [data-composition-id="comp-api-modal"] .key-sweep {
      display: flex;
      flex: 1;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    [data-composition-id="comp-api-modal"] .key-chunk {
      flex: 1 1 0;
      min-width: 0;
      height: 12px;
      transform-origin: left center;
      transform: scaleX(0);
    }
    [data-composition-id="comp-api-modal"] .key-chunk.k2 {
      flex-grow: 1.1;
    }
    [data-composition-id="comp-api-modal"] .key-chunk.k3 {
      flex-grow: 0.9;
    }
    [data-composition-id="comp-api-modal"] .key-chunk.k4 {
      flex-grow: 1.15;
    }
    [data-composition-id="comp-api-modal"] .key-chunk.k5 {
      flex-grow: 0.85;
    }
    [data-composition-id="comp-api-modal"] .eye-r {
      flex-shrink: 0;
    }
    [data-composition-id="comp-api-modal"] .eye-b {
      width: 20px;
      height: 10px;
    }
    [data-composition-id="comp-api-modal"] .hint-1 {
      width: 55%;
    }
    [data-composition-id="comp-api-modal"] .hint {
      margin: 8px 0 0;
    }
    [data-composition-id="comp-api-modal"] .btn-row {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      gap: 12px;
      margin-top: 20px;
    }
    [data-composition-id="comp-api-modal"] .start-vowel {
      display: block;
      width: 100%;
      height: 48px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      background: linear-gradient(180deg, #16a34a, #14532d);
      box-shadow: 0 4px 0 #052e16;
      cursor: default;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      var root = '[data-composition-id="comp-api-modal"]';
      var keySel = root + " #api-key-sweep .key-chunk";
      /* 5× stagger 0.09 + segment duration 0.1 → last segment ends 1.12 + 4*0.09 + 0.1 = 1.58 */
      var keyDone = 1.58;

      tl.set(root + " #api-start-vowel", { autoAlpha: 0, height: 0, marginTop: 0, overflow: "hidden" });
      tl.set(keySel, { scaleX: 0 });

      tl.to(root + " #api-back", { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 0.42);
      tl.to(root + " #api-modal", { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.25)" }, 0.52);

      /* Key entering (only content animation besides Start) */
      tl.to(
        keySel,
        { scaleX: 1, duration: 0.1, ease: "power2.out", stagger: 0.09, transformOrigin: "left center" },
        1.12
      );
      /* Only the Start CTA eases in; all other UI appears with the modal (no per-element entrance) */
      tl.fromTo(
        root + " #api-start-vowel",
        { autoAlpha: 0, y: 10, height: 0, marginTop: 0, overflow: "hidden" },
        { autoAlpha: 1, y: 0, height: 48, marginTop: 12, duration: 0.42, ease: "back.out(1.12)" },
        keyDone
      );
      tl.to(root + " #api-save-wrap", { scale: 0.97, y: 2, duration: 0.1, ease: "power2.in" }, 2.77);
      tl.to(root + " #api-save-wrap", { scale: 1, y: 0, duration: 0.45, ease: "elastic.out(1,0.55)" }, 2.89);
      tl.to(
        root + " #api-save-wrap",
        { boxShadow: "0 0 0 3px rgba(59,130,246,0.4)", borderRadius: 10, duration: 0.25, yoyo: true, repeat: 1 },
        3.02
      );

      tl.to(root + " #api-modal", { autoAlpha: 0, scale: 0.96, duration: 0.38, ease: "power3.in" }, 3.92);
      tl.to(root + " #api-back", { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 4.02);

      tl.set({}, {}, 7);
      window.__timelines["comp-api-modal"] = tl;
    })();
  </script>
</div>
