<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>vowel-tickets — component beats</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #020617;
        font-family: "DM Sans", system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .scene-wrap {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
        pointer-events: none;
      }
      #scene-inbox {
        z-index: 1;
      }
      #scene-github {
        z-index: 2;
        opacity: 0;
      }
      #scene-codespace {
        z-index: 3;
        opacity: 0;
      }
      #scene-voweldocs {
        z-index: 4;
        opacity: 0;
      }
      #scene-rag {
        z-index: 5;
        opacity: 0;
      }
      #scene-api {
        z-index: 6;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="vowel-tickets-main"
      data-start="0"
      data-duration="47.3"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="scene-inbox"
        class="scene-wrap"
        data-composition-id="comp-inbox"
        data-composition-src="compositions/comp-inbox.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-github"
        class="scene-wrap"
        data-composition-id="comp-github"
        data-composition-src="compositions/comp-github.html"
        data-start="7.65"
        data-duration="8"
        data-track-index="2"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-codespace"
        class="scene-wrap"
        data-composition-id="comp-codespace"
        data-composition-src="compositions/comp-codespace.html"
        data-start="15.3"
        data-duration="9"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-voweldocs"
        class="scene-wrap"
        data-composition-id="comp-voweldocs"
        data-composition-src="compositions/comp-voweldocs.html"
        data-start="23.95"
        data-duration="23.25"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-rag"
        class="scene-wrap"
        data-composition-id="comp-rag-modal"
        data-composition-src="compositions/comp-rag-modal.html"
        data-start="32.6"
        data-duration="8"
        data-track-index="5"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="scene-api"
        class="scene-wrap"
        data-composition-id="comp-api-modal"
        data-composition-src="compositions/comp-api-modal.html"
        data-start="40.25"
        data-duration="7"
        data-track-index="6"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        tl.set("#scene-inbox", { autoAlpha: 1 }, 0);

        tl.to("#scene-inbox", { autoAlpha: 0, scale: 1.06, duration: 0.35, ease: "power3.inOut" }, 7.65);
        tl.fromTo(
          "#scene-github",
          { autoAlpha: 0, scale: 0.94 },
          { autoAlpha: 1, scale: 1, duration: 0.35, ease: "power3.inOut" },
          7.65
        );

        tl.to("#scene-github", { autoAlpha: 0, xPercent: -14, duration: 0.35, ease: "power2.inOut" }, 15.3);
        tl.fromTo(
          "#scene-codespace",
          { autoAlpha: 0, xPercent: 14 },
          { autoAlpha: 1, xPercent: 0, duration: 0.35, ease: "power2.inOut" },
          15.3
        );

        tl.to("#scene-codespace", { autoAlpha: 0, filter: "blur(12px)", duration: 0.45, ease: "sine.inOut" }, 23.95);
        tl.fromTo(
          "#scene-voweldocs",
          { autoAlpha: 0, filter: "blur(12px)" },
          { autoAlpha: 1, filter: "blur(0px)", duration: 0.45, ease: "sine.inOut" },
          23.95
        );

        /* voweldocs stays visible; RAG + API are transparent overlay scenes */
        tl.fromTo("#scene-rag", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 32.6);

        tl.to("#scene-rag", { autoAlpha: 0, duration: 0.35, ease: "power3.in" }, 40.25);
        tl.fromTo(
          "#scene-api",
          { autoAlpha: 0, y: 28 },
          { autoAlpha: 1, y: 0, duration: 0.38, ease: "power3.out" },
          40.25
        );

        tl.to("#scene-api", { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, 46.5);
        tl.to("#scene-voweldocs", { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, 46.5);

        tl.set({}, {}, 47.3);

        window.__timelines["vowel-tickets-main"] = tl;
      })();
    </script>
  </body>
</html>
