<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="vowel-onboarding-master"
      data-width="1080"
      data-height="1920"
      data-start="0"
      data-duration="91"
    >
      <audio
        id="voice"
        preload="auto"
        data-start="0"
        data-duration="80.8"
        data-track-index="0"
        src="assets/SCRIPT_DRAFT.wav"
        data-volume="1"
      ></audio>
      <!-- BGM: duck under in-app dialogue (from “Hey,” through “shot.” + 2s breath). -->
      <audio
        id="bgm-pre"
        preload="auto"
        data-start="0"
        data-duration="28.69"
        data-track-index="1"
        data-media-start="0"
        src="assets/Independent Music Licensing Collective (IMLC) - Joseph Sacco - Memory Lane.mp3"
        data-volume="0.06"
      ></audio>
      <audio
        id="bgm-dialogue"
        preload="auto"
        data-start="28.69"
        data-duration="46.97"
        data-track-index="1"
        data-media-start="28.69"
        src="assets/Independent Music Licensing Collective (IMLC) - Joseph Sacco - Memory Lane.mp3"
        data-volume="0"
      ></audio>
      <audio
        id="bgm-post"
        preload="auto"
        data-start="75.66"
        data-duration="15.34"
        data-track-index="1"
        data-media-start="75.66"
        src="assets/Independent Music Licensing Collective (IMLC) - Joseph Sacco - Memory Lane.mp3"
        data-volume="0.06"
      ></audio>

      <div id="stage-bg" class="clip" data-start="0" data-duration="91" data-track-index="2"></div>

      <!-- 2× inbox camera paint extends past 1920×1080 — keep host chain overflow visible (see vowel-components #scene-inbox). -->
      <div class="scene-scale-host" id="scene-inbox-wrap">
        <div class="scene-scale-viewport">
          <div
            id="scene-inbox-host"
            class="clip"
            data-composition-id="comp-inbox"
            data-composition-src="compositions/comp-inbox.html"
            data-start="2.23"
            data-duration="88.77"
            data-track-index="3"
            data-width="1920"
            data-height="1080"
          ></div>
        </div>
      </div>

      <div class="scene-scale-host" id="scene-voweldocs-wrap">
        <div class="scene-scale-viewport">
          <div
            id="scene-voweldocs-host"
            class="clip"
            data-composition-id="comp-voweldocs"
            data-composition-src="compositions/comp-voweldocs.html"
            data-start="12.99"
            data-duration="78.01"
            data-track-index="4"
            data-width="1920"
            data-height="1080"
          ></div>
        </div>
      </div>

      <!-- Full-bleed portrait opener (same idea as vowel-turso-rag #opener — not letterboxed 16:9). -->
      <div
        id="scene-intro-host"
        class="clip"
        data-composition-id="comp-wordstack-intro"
        data-composition-src="compositions/comp-wordstack-intro.html"
        data-start="0"
        data-duration="3.38"
        data-track-index="5"
        data-width="1080"
        data-height="1920"
      ></div>

      <div id="karaoke-wrap" class="clip" data-start="0" data-duration="91" data-track-index="6">
        <!-- Word-level karaoke in #karaoke-stage (promo block + in-app dialogue). -->
        <div id="karaoke-root" aria-live="polite">
          <div id="karaoke-stage"></div>
        </div>
      </div>

      <div id="outro-layer" class="clip" data-start="0" data-duration="91" data-track-index="7">
        <p class="out-hero">Get started today at</p>
        <a class="out-url" href="https://vowel.to">https://vowel.to</a>
        <p class="out-attr">
          Music: «Memory Lane» by Joseph Sacco (Independent Music Licensing Collective — IMLC), licensed under
          <a href="https://creativecommons.org/licenses/by/4.0/" style="color: inherit">CC BY 4.0</a>.
          <a
            href="https://freemusicarchive.org/music/independent-music-licensing-collective-imlc/new-signings-compilation/joseph-sacco-memory-lane/"
            style="color: inherit"
            >Free Music Archive</a
          >.
        </p>
      </div>

      <div class="grain-veil" aria-hidden="true"></div>
    </div>

    <script src="transcript-words.js"></script>
    <script>
      (function () {
        var W = window.ONBOARDING_WORDS;
        if (W && W.length) {
          /* Hero = first 2 tokens (“Customer Onboarding”); sub = “how’s” “it” “going?” — display fix: no comma, capital O. */
          var w5 = W.slice(0, 5).map(function (w, i) {
            if (i === 1) {
              return { type: w.type, text: "Onboarding", start: w.start, end: w.end };
            }
            return w;
          });
          window.VOWEL_WORDSTACK_INTRO = {
            words: w5,
            headlineWordCount: 2,
            subPosition: "below",
          };
        }
        /* Inbox comp clock: host `data-start` = end of “going?”; pad 0 = wordstack not in this comp’s timeline. */
        window.VOWEL_INBOX_WORDSTACK_PAD = 0;
        if (W && W.length) {
          var a;
          var hostStart = 2.23;
          var tTrouble = 4.88;
          var tTop = 7.33;
          var tWhat = 12.99;
          for (a = 0; a < W.length; a++) {
            if (W[a].text === "going?") {
              hostStart = W[a].end;
            }
            if (W[a].text === "trouble" && a + 1 < W.length && W[a + 1].text === "tickets?") {
              tTrouble = W[a].start;
            }
            if (W[a].text === "top" && a > 0 && W[a - 1].text === "on" && a + 1 < W.length && W[a + 1].text === "of") {
              tTop = W[a].start;
            }
            if (W[a].text === "What" && a + 1 < W.length && W[a + 1].text === "if") {
              tWhat = W[a].start;
            }
          }
          window.VOWEL_INBOX_HOST_START = hostStart;
          window.VOWEL_INBOX_T_TROUBLE = tTrouble - hostStart;
          window.VOWEL_INBOX_T_NE = tTop - hostStart;
          window.VOWEL_VOWELDOCS_IN = tWhat;
        }
      })();
    </script>
    <script src="script.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["vowel-onboarding-master"] =
        window.__timelines["vowel-onboarding-master"] || gsap.timeline({ paused: true });
    </script>
  </body>
</html>
