<!DOCTYPE html>

    <div id="root" class="root" data-composition-id="vowel-turso-rag-master" data-width="1080" data-height="1920" data-start="0" data-duration="141.786">

      <audio id="voice" preload="auto" data-start="0" data-duration="141.786" data-track-index="0" src="assets/turso-rag.wav" data-volume="1"></audio>
      <!--
        BGM: sequential clips; render mix uses data-volume + data-media-start only.
        Silent: from "Welcome" (88.242s) through the end of the in-app block ("credentials." ~117.67s) + 2s breath, then bed back.
        post start = 119.671 — keep in sync with script.js (tLastAiEnd + 2) if transcript timing changes.
      -->
      <audio id="bgm-pre" preload="auto" data-start="0" data-duration="88.242" data-track-index="1" data-media-start="0" src="assets/Independent Music Licensing Collective (IMLC) - Joseph Sacco - Memory Lane.mp3" data-volume="0.06"></audio>

      <div id="stage-bg" class="clip" data-start="0" data-duration="141.786" data-track-index="2"></div>

      <!-- Repeating Turso wordmark: only visible during the Turso beat (script toggles opacity) -->

        id="turso-bg-pattern"
        class="clip turso-bg-pattern"
        data-start="0"
        data-duration="141.786"
        data-track-index="14"
        aria-hidden="true"

        <div class="turso-bg-pattern__rotor">
          <div class="turso-bg-pattern__rows" id="turso-bg-pattern-rows"></div>
        </div>
      </div>

      <!-- UI grabs: behind ribbon + captions (z-index); one visible at a time via script. -->

        <div class="ui-shot-slab">
          <div
            id="shot-chat"
            class="clip ui-bg-shot-wrap"
            data-start="0"
            data-duration="141.786"
            data-track-index="10"
          >
            <div class="ui-bg-shot-pivot ui-bg-shot-pivot--rag">

            </div>
          </div>
          <div
            id="shot-config"
            class="clip ui-bg-shot-wrap"
            data-start="0"
            data-duration="141.786"
            data-track-index="11"

            <div class="ui-bg-shot-pivot ui-bg-shot-pivot--rag">
              <img class="ui-bg-shot-img" alt="" src="assets/config.png" />
            </div>
          </div>
          <div

            data-duration="141.786"
            data-track-index="12"

              <img class="ui-bg-shot-img" alt="" src="assets/api-key.png" />
            </div>
          </div>
          <div
            id="shot-talk"
            class="clip ui-bg-shot-wrap"
            data-start="0"
            data-duration="141.786"
            data-track-index="13"

            <div class="ui-bg-shot-pivot ui-bg-shot-pivot--mic">
              <img class="ui-bg-shot-img" alt="" src="assets/voweldocs-talk.png" />

        </div>
      </div>

        </div>
      </div>

      <div id="opener" class="clip" data-start="0" data-duration="141.786" data-track-index="5">
        <div id="opener-inner">
          <div id="title-rag">RAG</div>
          <div class="opener-sub">
            <span id="ow-in">in</span>
            <span id="ow-the">the</span>
            <span id="ow-browser">browser.</span>

        </div>
      </div>

      <div id="outro-layer" class="clip" data-start="0" data-duration="141.786" data-track-index="6">
        <p class="out-hero">Get started today at</p>

      <div class="grain-veil" aria-hidden="true"></div>

    </div>

    <script src="transcript-words.js"></script>
    <script src="script.js"></script>
    <script>
      /* Lint: static registration check; script.js assigns the real timeline first (sync). */
      window.__timelines = window.__timelines || {};
      window.__timelines["vowel-turso-rag-master"] =
        window.__timelines["vowel-turso-rag-master"] || gsap.timeline({ paused: true });

  </body>
</html>
