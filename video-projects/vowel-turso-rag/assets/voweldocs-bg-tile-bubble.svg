<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 72" width="400" height="72" role="img" aria-label="voweldocs bar, chat bubble">
  <defs>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="3" width="396" height="66" rx="20" fill="#1a2332" stroke="#22c55e" stroke-width="1.5" filter="url(#g)"/>
  <!-- Rounded single speech bubble (green) -->
  <g transform="translate(14, 16)">
    <path fill="none" stroke="#4ade80" stroke-width="2" stroke-linejoin="round" d="M8 4h32c4 0 8 2 8 7v8c0 4-2 7-5 7h-6l-5 4v-4H8c-3 0-5-2-5-5V9c0-3 2-5 5-5z"/>
  </g>
  <text x="200" y="45" text-anchor="middle" font-family="ui-monospace, 'JetBrains Mono', 'Cascadia Code', monospace" font-size="20" font-weight="500" fill="#e8eef8" letter-spacing="0.12em">voweldocs</text>
  <path d="M358 32l5 5 9-9" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
