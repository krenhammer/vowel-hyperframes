<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=1080, height=1920" />

      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      /*
        Previous horizontal (16:9) canvas — do not delete; see vertical + letterbox below.
        html, body { width: 1920px; height: 1080px; }
        #root { width: 1920px; height: 1080px; }
        .scene-wrap { width: 1920px; height: 1080px; } — full-bleed, no .scene-scale-* wrapper.
      */
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #020617;
        font-family: "DM Sans", system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        isolation: isolate;
        /* Landscape mock comps stay 1920×1080; scale+letterbox into 9:16 (see COMPONENTS.md). */
        --vf-mock-landscape-w: 1080;
      }
      /*
        Letterbox 16:9 compositions into the portrait frame. Mock quadrant zoom in comp-*.html
        is commented out (script include + calls); source kept in mock-quadrant-tour.js.
      */
      .scene-scale-host {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /*
          Full-bleed solid here blocked every layer below: #scene-wordstack-intro is z-index 150
          and the master timeline never toggled the host, so only the intro was visible. Keep the
          letterbox / mock backing on .scene-scale-viewport only; body/#root still fill the frame.
        */
        background: transparent;
        pointer-events: none;
        overflow: hidden;
      }
      .scene-scale-viewport {
        width: calc(1px * var(--vf-mock-landscape-w, 1080));
        height: calc(1px * var(--vf-mock-landscape-w, 1080) * 1080 / 1920);
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
        background: #020617;
      }
      .scene-scale-viewport > .scene-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px !important;
        height: 1080px !important;
        transform: scale(calc(var(--vf-mock-landscape-w, 1080) / 1920));
        transform-origin: 0 0;
        background: #020617;
        backface-visibility: hidden;
        pointer-events: none;
      }
      /*
        Modal comps (RAG + API) are separate tracks but must read as overlays on the voweldocs mock.
        Default letterbox viewport + .scene-wrap use solid #020617, which hides #scene-voweldocs beneath.
        Transparent stack here so comp-*-modal backdrops dim the mock instead of replacing it.
      */
      .scene-scale-host--modal-over-mock .scene-scale-viewport,
      .scene-scale-host--modal-over-mock .scene-scale-viewport > .scene-wrap {
        background: transparent;
      }
      /*
        Non-mock scenes (wordstack, Turso marquee, CTA pattern, outro): fill 9:16 with the 16:9 comp
        “cover”-style (scale to full height, clip sides). Avoids letterbox gutters where e.g. the
        dialogue chrome or #root would show through.
      */
      .scene-scale-host--portrait-fill .scene-scale-viewport {
        width: 1080px;
        height: 1920px;
        flex-shrink: 0;
      }
      .scene-scale-host--portrait-fill .scene-scale-viewport > .scene-wrap {
        left: 50%;
        top: 50%;
        margin-left: -960px;
        margin-top: -540px;
        transform: scale(calc(1920 / 1080));
        transform-origin: center center;
      }
      /*
        comp-outro: left-aligned 1920×1080 layout sits in the cropped-off left region after cover-scale.
        Inset the flex column to the visible center band: width 1080px * 1080/1920 ≈ 607.5px, centered in 1920.
      */
      #scene-outro.scene-scale-host--portrait-fill [data-composition-id="comp-outro"] #comp-outro-layer {
        align-items: center;
        padding-left: calc(50% - (1080 / 1920 * 1080px) / 2);
        padding-right: calc(50% - (1080 / 1920 * 1080px) / 2);
      }
      #scene-outro.scene-scale-host--portrait-fill [data-composition-id="comp-outro"] #comp-outro-layer .comp-outro-hero,
      #scene-outro.scene-scale-host--portrait-fill [data-composition-id="comp-outro"] #comp-outro-layer .comp-outro-url,
      #scene-outro.scene-scale-host--portrait-fill [data-composition-id="comp-outro"] #comp-outro-layer .comp-outro-attr {
        max-width: 100%;
        align-self: center;
        text-align: left;
      }
      #scene-outro.scene-scale-host--portrait-fill [data-composition-id="comp-outro"] #comp-outro-layer .comp-outro-attr {
        /* Narrow visible band: a bit more horizontal inset than the 16:9 comp defaults. */
        padding-left: clamp(28px, 3.2vmin, 44px);
        padding-right: clamp(28px, 3.2vmin, 44px);
      }
      .scene-wrap {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      /* Full-frame word-stack opener (comp-wordstack-intro); fades to reveal inbox underneath. */
      #scene-wordstack-intro {
        z-index: 150;
        pointer-events: none;
      }
      #scene-inbox {
        z-index: 1;
      }
      #scene-github {
        z-index: 2;
        opacity: 0;
      }
      #scene-codespace {
        z-index: 3;
        opacity: 0;
      }
      #scene-voweldocs {
        z-index: 4;
        opacity: 0;
      }
      #scene-rag {
        z-index: 5;
        opacity: 0;
      }
      #scene-api {
        z-index: 6;
        opacity: 0;
      }
      #scene-turso-svg {
        z-index: 7;
        opacity: 0;
      }
      /* Full-frame voweldocs CTA grid — own scene after Turso SVG (not under the mock). */
      #scene-voweldocs-cta-bg {
        z-index: 8;
        opacity: 0;
      }
      /* vowel-turso-rag outro — comp-outro */
      #scene-outro {
        z-index: 9;
        opacity: 0;
      }
      /* Ported from vowel-turso-rag: in-app dialogue chrome (green rail + ghost word). */
      :root {
        --vd-turso-accent: #0fd06e;
      }
      .vd-inapp-dialogue-chrome {
        position: absolute;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        overflow: hidden;
        box-sizing: border-box;
        border-left: 3px solid color-mix(in srgb, var(--vd-turso-accent) 50%, transparent);
        padding-left: 28px;
      }
      .vd-inapp-dialogue-chrome__watermark {
        position: absolute;
        left: 8%;
        top: 6%;
        font-family: "Outfit", "DM Sans", system-ui, sans-serif;
        font-weight: 800;
        font-size: clamp(120px, 14vw, 220px);
        line-height: 1;
        color: rgba(232, 238, 248, 0.12);
        letter-spacing: -0.03em;
        user-select: none;
      }
    </style>
  </head>
  <body>

    <script src="animated-image-background/AnimatedImageBackground.js"></script>
    <script>
      (function () {
        /**
         * Caption “copy” is abstract bars only (no readable strings, no title row). See COMPONENTS.md.
         * @param {{ speaker?: string, lines: string[] }} spec - `lines` = width keys 100|92|88|80|72|60 per bar.
         * @param {"inactive"|"active"|"user"|"thinking"|"ai"} state - drives `#vd-fab` only; caption stays neutral.
         */
        function vdCaptionSet(spec, state) {
          var el = document.getElementById("vd-caption");
          if (!el) {
            return;
          }
          spec = spec || { lines: [] };
          el.setAttribute("data-vd-state", state);
          el.setAttribute("data-vd-speaker", spec.speaker || "");
          el.className = "vd-caption clip vd-cap--" + (state || "inactive");
          var body = el.querySelector("#vd-cap-body");
          var L = spec.lines || [];
          body.innerHTML = L.map(function (w) {
            return '<div class="abs-bar clip cap-w-' + w + '" aria-hidden="true"></div>';
          }).join("");
          el.setAttribute("aria-hidden", "true");
        }
        /** Maps COMPONENTS.md states to the same #vd-fab palette as comp-voweldocs VOICE_FAB_COLORS. */
        var VD_FAB_STATE = {
          inactive: { bg: "#6b7280", border: "rgba(255,255,255,0.2)" },
          active: { bg: "#22c55e", border: "#86efac" },
          user: { bg: "#3b82f6", border: "rgba(255,255,255,0.3)" },
          thinking: { bg: "#eab308", border: "rgba(0,0,0,0.2)" },
          ai: { bg: "#a855f7", border: "rgba(255,255,255,0.3)" },
        };
        function vdApplyFabState(state) {
          var c = VD_FAB_STATE[state] || VD_FAB_STATE.inactive;
          return { backgroundColor: c.bg, borderColor: c.border, boxShadow: "0 12px 40px rgba(0,0,0,0.5)" };
        }
        window.vdCaptionSet = vdCaptionSet;

        window.__timelines = window.__timelines || {};
        /** Word-stack intro — keep in sync with `#scene-wordstack-intro` + `WORDSTACK_INTRO_PAD` in comp-inbox. */
        var WORDSTACK_INTRO = 2.46;
        /** “Support Inbox” hold before list motion — keep in sync with `INBOX_TITLE_PAUSE` in comp-inbox. */
        var INBOX_PRE_ANIM_PAUSE = 1;
        var INBOX_LEAD = WORDSTACK_INTRO + INBOX_PRE_ANIM_PAUSE;
        var tl = gsap.timeline({ paused: true });

        tl.set("#vd-caption", { autoAlpha: 0, y: -20, force3D: true }, 0);
        tl.set("#vd-inapp-dialogue-chrome", { autoAlpha: 0 }, 0);
        tl.set("#scene-inbox", { autoAlpha: 1 }, 0);
        tl.set("#scene-turso-svg", { autoAlpha: 0 }, 0);
        tl.set("#scene-voweldocs-cta-bg", { autoAlpha: 0 }, 0);
        tl.set("#scene-outro", { autoAlpha: 0 }, 0);
        /* Hand off to inbox: the intro host must leave (in addition to any in-comp fade). */
        tl.set("#scene-wordstack-intro", { autoAlpha: 1 }, 0);
        tl.to(
          "#scene-wordstack-intro",
          { autoAlpha: 0, duration: 0.45, ease: "power2.inOut" },
          Math.max(0, WORDSTACK_INTRO - 0.45)
        );

        tl.to("#scene-inbox", { autoAlpha: 0, scale: 1.06, duration: 0.35, ease: "power3.inOut" }, 7.65 + INBOX_LEAD);
        tl.fromTo(
          "#scene-github",
          { autoAlpha: 0, scale: 0.94 },
          { autoAlpha: 1, scale: 1, duration: 0.35, ease: "power3.inOut" },
          7.65 + INBOX_LEAD
        );

        tl.to("#scene-github", { autoAlpha: 0, xPercent: -14, duration: 0.35, ease: "power2.inOut" }, 15.3 + INBOX_LEAD);
        tl.fromTo(
          "#scene-codespace",
          { autoAlpha: 0, xPercent: 14 },
          { autoAlpha: 1, xPercent: 0, duration: 0.35, ease: "power2.inOut" },
          15.3 + INBOX_LEAD
        );

        tl.to("#scene-codespace", { autoAlpha: 0, filter: "blur(12px)", duration: 0.45, ease: "sine.inOut" }, 23.95 + INBOX_LEAD);
        tl.fromTo(
          "#scene-voweldocs",
          { autoAlpha: 0, filter: "blur(12px)" },
          { autoAlpha: 1, filter: "blur(0px)", duration: 0.45, ease: "sine.inOut" },
          23.95 + INBOX_LEAD
        );
        tl.fromTo("#scene-rag", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 32.6 + INBOX_LEAD);

        tl.to("#scene-rag", { autoAlpha: 0, duration: 0.35, ease: "power3.in" }, 40.25 + INBOX_LEAD);
        tl.fromTo(
          "#scene-api",
          { autoAlpha: 0, y: 28 },
          { autoAlpha: 1, y: 0, duration: 0.38, ease: "power3.out" },
          40.25 + INBOX_LEAD
        );
        tl.to("#vd-inapp-dialogue-chrome", { autoAlpha: 1, duration: 0.35, ease: "sine.out" }, 40.25 + INBOX_LEAD);

        /* #vd-fab: same DOM node as comp-voweldocs; here we only drive API / key / “active” beat (overwrite child timeline). */
        var T_API = 40.25 + INBOX_LEAD;
        var T_KEY = 1.58;
        var ow = { overwrite: "auto" };
        tl.to("#vd-fab", { autoAlpha: 0, scale: 0.88, duration: 0.2, ease: "power2.in", ...ow }, T_API);
        tl.fromTo(
          "#vd-fab",
          { autoAlpha: 0, scale: 0.88, backgroundColor: "#27272a" },
          { autoAlpha: 1, scale: 1, duration: 0.4, ease: "back.out(1.25)", ...ow },
          T_API + T_KEY
        );
        tl.to("#vd-fab", { scale: 0.9, duration: 0.1, ease: "power2.in", ...ow }, T_API + T_KEY + 0.5);
        /* Config modal must fully dismiss before green + any other FAB / caption colors. */
        var T_MODAL_FADE = T_API + T_KEY + 0.45;
        var T_MODAL_GONE = T_MODAL_FADE + 0.55;
        tl.to("#scene-api", { autoAlpha: 0, duration: 0.55, ease: "power2.in" }, T_MODAL_FADE);
        tl.to("#vd-inapp-dialogue-chrome", { autoAlpha: 0, duration: 0.4, ease: "power2.in" }, T_MODAL_FADE);
        var T_GREEN = T_MODAL_GONE + 0.05;
        tl.to(
          "#vd-fab",
          {
            scale: 1,
            backgroundColor: "#22c55e",
            borderColor: "#86efac",
            boxShadow: "0 12px 36px rgba(22, 163, 74, 0.5)",
            duration: 0.4,
            ease: "back.out(1.45)",
            ...ow,
          },
          T_GREEN
        );
        /* Post–modal: caption = abs-bars; #vd-fab = palette per COMPONENTS.md. */
        var T1 = T_GREEN + 0.35;
        tl.add(
          function () {
            vdCaptionSet({ speaker: "a", lines: ["100", "88"] }, "active");
          },
          T1
        );
        tl.fromTo(
          "#vd-caption",
          { y: -24, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.5, ease: "back.out(1.2)", ...ow },
          T1
        );

        tl.to(
          "#vd-caption",
          { y: -12, autoAlpha: 0, duration: 0.22, ease: "power2.in", overwrite: "auto" },
          T1 + 0.9
        );
        var T2 = T1 + 0.95;
        tl.add(
          function () {
            vdCaptionSet({ speaker: "b", lines: ["72"] }, "user");
          },
          T2
        );
        tl.fromTo(
          "#vd-caption",
          { y: 14, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.38, ease: "power3.out", ...ow },
          T2
        );
        tl.to(
          "#vd-fab",
          { duration: 0.32, ease: "power2.out", ...vdApplyFabState("user"), ...ow },
          T2
        );

        var T3 = T2 + 0.7;
        tl.to(
          "#vd-caption",
          { y: -10, autoAlpha: 0, duration: 0.2, ease: "power2.in", overwrite: "auto" },
          T3
        );
        var T4 = T3 + 0.06;
        tl.add(
          function () {
            vdCaptionSet({ speaker: "a", lines: ["92", "80"] }, "thinking");
          },
          T4
        );
        tl.fromTo(
          "#vd-caption",
          { y: 12, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.4, ease: "power2.out", ...ow },
          T4
        );
        tl.to(
          "#vd-fab",
          { duration: 0.32, ease: "power2.out", ...vdApplyFabState("thinking"), ...ow },
          T4
        );

        var T5 = T4 + 0.85;
        tl.to(
          "#vd-caption",
          { y: -10, autoAlpha: 0, duration: 0.2, ease: "power2.in", overwrite: "auto" },
          T5
        );
        var T6 = T5 + 0.06;
        tl.add(
          function () {
            vdCaptionSet({ speaker: "a", lines: ["100", "88"] }, "ai");
          },
          T6
        );
        tl.fromTo(
          "#vd-caption",
          { y: 14, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.42, ease: "power2.out", ...ow },
          T6
        );
        tl.to(
          "#vd-fab",
          { duration: 0.32, ease: "power2.out", ...vdApplyFabState("ai"), ...ow },
          T6
        );

        var T7 = T6 + 0.95;
        tl.to(
          "#vd-caption",
          { y: -8, autoAlpha: 0, duration: 0.2, ease: "power2.in", overwrite: "auto" },
          T7
        );
        var T8 = T7 + 0.06;
        tl.add(
          function () {
            vdCaptionSet({ speaker: "a", lines: ["80"] }, "active");
          },
          T8
        );
        tl.fromTo(
          "#vd-caption",
          { y: 10, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.36, ease: "back.out(1.1)", ...ow },
          T8
        );
        tl.to(
          "#vd-fab",
          { duration: 0.32, ease: "power2.out", ...vdApplyFabState("active"), ...ow },
          T8
        );
        tl.to(
          "#vd-caption",
          { y: -16, autoAlpha: 0, duration: 0.3, ease: "power2.in", overwrite: "auto" },
          T8 + 0.6
        );
        tl.add(
          function () {
            vdCaptionSet({ speaker: "", lines: [] }, "inactive");
            gsap.set("#vd-caption", { y: 0, autoAlpha: 0 });
          },
          T8 + 0.64
        );

        /* After caption beat — crossfade voweldocs → Turso SVG marquee (comp-turso-svg-bg). */
        var T_VOWEL_FADE = 47.75 + INBOX_LEAD;
        tl.to("#scene-voweldocs", { autoAlpha: 0, duration: 0.6, ease: "power2.in" }, T_VOWEL_FADE);
        tl.fromTo(
          "#scene-turso-svg",

        /* Full-frame CTA grid — separate scene after Turso SVG (comp-voweldocs-cta-bg). */

        tl.to("#scene-turso-svg", { autoAlpha: 0, duration: 0.5, ease: "power2.in", overwrite: "auto" }, T_TURSO_END);
        tl.fromTo(
          "#scene-voweldocs-cta-bg",

          { autoAlpha: 1, duration: 0.5, ease: "power2.out" },

        );

        var T_CTA_END = 65.05 + INBOX_LEAD;

        tl.to("#scene-voweldocs-cta-bg", { autoAlpha: 0, duration: 0.48, ease: "power2.in" }, T_CTA_END - 0.38);
        tl.to("#scene-outro", { autoAlpha: 1, duration: 0.52, ease: "power2.out" }, T_CTA_END - 0.35);
        tl.set({}, {}, T_CTA_END + OUTRO_LEN);

        window.__timelines["vowel-components-main"] = tl;
      })();
