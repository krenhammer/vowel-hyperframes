<!--
  Standalone: vowel-turso-rag #turso-bg-pattern (AnimatedImageBackground + voweldocs-button.png).
  Master: index.html #scene-voweldocs-cta-bg — placed after #scene-turso-svg (z-index 8), not under comp-voweldocs.
  Preview: ?comp=comp-voweldocs-cta-bg
-->
<div
  data-composition-id="comp-voweldocs-cta-bg"
  data-start="0"
  data-duration="8.65"
  data-width="1920"
  data-height="1080"
  style="position: absolute; inset: 0; width: 1920px; height: 1080px; overflow: hidden"
>
  <link rel="stylesheet" href="animated-image-background/AnimatedImageBackground.css" />
  <style>
    [data-composition-id="comp-voweldocs-cta-bg"] {
      background: transparent;
    }
    [data-composition-id="comp-voweldocs-cta-bg"] .vd-cta-aib-wrap {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    [data-composition-id="comp-voweldocs-cta-bg"] .voweldocs-cta-aib-host {
      position: absolute;
      inset: 0;
      z-index: 1;
      width: 100%;
      height: 100%;
    }
    [data-composition-id="comp-voweldocs-cta-bg"] .voweldocs-pattern-scrim {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(6, 8, 15, 0.52) 0%,
        rgba(6, 8, 15, 0.62) 45%,
        rgba(6, 8, 15, 0.55) 100%
      );
    }
    [data-composition-id="comp-voweldocs-cta-bg"] .voweldocs-cta-aib-host .aib__ring {
      border: none;
      box-shadow: none;
      border-radius: 0;
      background: transparent;
    }
    [data-composition-id="comp-voweldocs-cta-bg"] .voweldocs-cta-aib-host .aib__img {
      width: 88%;
      height: 88%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.45));
    }
  </style>
  <div class="vd-cta-aib-wrap" aria-hidden="true">
    <div id="comp-voweldocs-cta-aib-host" class="voweldocs-cta-aib-host"></div>
    <div class="voweldocs-pattern-scrim" aria-hidden="true"></div>
  </div>
  <script src="animated-image-background/AnimatedImageBackground.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      function mount() {
        var root = document.querySelector('[data-composition-id="comp-voweldocs-cta-bg"]');
        var host = root && root.querySelector("#comp-voweldocs-cta-aib-host");
        if (!host || !window.AnimatedImageBackground || host.querySelector(".aib")) {
          return Boolean(host && host.querySelector(".aib"));
        }
        new window.AnimatedImageBackground(host, {
          imageSrc: "assets/voweldocs-button.png",
          angleDeg: -45,
          cellSize: "min(41.6rem, 100%)",
          cellMaxCap: "736px",
          minCellSize: "320px",
          backgroundColor: "#121b2e",
          ringColor: "rgba(15, 208, 110, 0.4)",
          accentColor: "#0fd06e",
          pressAnimation: "random",
          seed: 0x5a7e1c3f,
          periodRangeSec: { min: 7.4, max: 17.5 },
          maxNegativeDelaySec: 22,
        });
        return true;
      }
      var n = 0;
      function tick() {
        if (mount() || n++ > 120) {
          return;
        }
        setTimeout(tick, 32);
      }
      tick();

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 8.65);
      window.__timelines["comp-voweldocs-cta-bg"] = tl;
    })();
  </script>
</div>
