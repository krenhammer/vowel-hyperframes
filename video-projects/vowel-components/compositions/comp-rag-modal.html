  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
      var root = '[data-composition-id="comp-rag-modal"]';

      function setRagView(mode) {
        var pr = document.querySelector(root + " #rag-panel-root");
        var ta = document.querySelector(root + " #rag-tab-a");
        var tb = document.querySelector(root + " #rag-tab-b");
        if (!pr) return;
        if (mode === "docs") {
          pr.classList.remove("is-chat");
          pr.classList.add("is-docs");
          if (ta) ta.classList.add("is-active");
          if (tb) tb.classList.remove("is-active");
        } else {
          pr.classList.remove("is-docs");
          pr.classList.add("is-chat");
          if (ta) ta.classList.remove("is-active");
          if (tb) tb.classList.add("is-active");
        }
      }

      tl.add(function () {
        setRagView("docs");
      }, 0);
      tl.set(root + " #rag-chat-2", { autoAlpha: 0, height: 0, margin: 0, overflow: "hidden" }, 0);
      tl.to(root + " #rag-back", { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 0.1);
      tl.to(root + " #rag-modal", { autoAlpha: 1, scale: 1, duration: 0.45, ease: "back.out(1.2)" }, 0.2);
      /* Documents tree: no animation (static) */
      tl.add(function () {
        setRagView("chat");
      }, 0.78);
      tl.from(root + " #rag-composer", { autoAlpha: 0, y: 6, duration: 0.25 }, 0.82);
      tl.from(root + " #rag-h-user", { autoAlpha: 0, y: 8, duration: 0.3 }, 0.85);
      tl.from(root + " #rag-h-ai1", { autoAlpha: 0, y: 6, duration: 0.28 }, 1.0);
      tl.from(root + " #rag-h-ai2", { autoAlpha: 0, y: 6, duration: 0.28 }, 1.15);

      tl.to(root + " #rag-modal", { autoAlpha: 0, scale: 0.96, duration: 0.35, ease: "power3.in" }, 2.6);
      tl.to(root + " #rag-back", { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, 2.7);

      tl.add(function () {
        setRagView("chat");
      }, 3.28);
      tl.set(root + " #rag-chat-2", { clearProps: "height,margin" }, 3.3);
      tl.set(root + " #rag-chat-2", { autoAlpha: 1, overflow: "visible" }, 3.3);
      tl.to(root + " #rag-back", { autoAlpha: 1, duration: 0.3, ease: "power2.out" }, 3.3);
      tl.to(root + " #rag-modal", { autoAlpha: 1, scale: 1, duration: 0.42, ease: "back.out(1.15)" }, 3.35);
      tl.from(root + " #rag-h-user-2", { autoAlpha: 0, y: 6, duration: 0.28 }, 3.6);
      tl.from(root + " #rag-h-ai3", { autoAlpha: 0, y: 6, duration: 0.26 }, 3.78);
      tl.from(root + " #rag-h-ai4", { autoAlpha: 0, y: 6, duration: 0.26 }, 3.95);

      tl.to(root + " #rag-modal", { autoAlpha: 0, y: 24, duration: 0.38, ease: "power3.in" }, 5.3);
      tl.to(root + " #rag-back", { autoAlpha: 0, duration: 0.28, ease: "power2.in" }, 5.37);

      tl.set({}, {}, 8);
      window.__timelines["comp-rag-modal"] = tl;
    })();
  </script>
